name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-lite-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/paseo-lite

  # Unit tests: pure logic inside the daemon (config merge, cleanup guards,
  # push payloads, snapshot cleaning, retry classification, ...).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --bins

  # Integration tests: start the real binary and drive it over HTTP and
  # WebSocket like the app does (tests/e2e.rs, with a fake `claude` CLI).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Integration tests
        run: cargo test --test e2e --test edge -- --test-threads=4

  # Static musl binaries for the Docker image (Alpine), one per architecture,
  # built natively on matching runners (no cross toolchain or QEMU).
  musl:
    needs: [build, unit, integration]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: paseo-lite-x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: paseo-lite-aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        run: |
          set -euo pipefail
          cp target/${{ matrix.target }}/release/paseo-lite "${{ matrix.name }}"
          sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}*

  # Published as a rolling "latest" release so the image build downloads the
  # binaries instead of compiling.
  release:
    needs: [musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: paseo-lite-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f latest
          git push -f origin latest
          files=(dist/*)
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "${files[@]}" --clobber
            gh release edit latest --target "$GITHUB_SHA" --latest=false
          else
            gh release create latest "${files[@]}" --title "latest" --notes "Rolling build of main for the Docker image" --target "$GITHUB_SHA" --latest=false
          fi
